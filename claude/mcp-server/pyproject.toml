[project]
name = "cherrytree-mcp"
version = "0.1.0"
description = "MCP server that lets Claude search, read and edit CherryTree notebooks, Notion-style"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "mcp>=2.3,<3",
    "markdown-it-py>=4,<5",
]

[project.scripts]
cherrytree-mcp = "cherrytree_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cherrytree_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["e2e: round-trips through a real CherryTree binary (skipped when none is found)"]

[tool.coverage.run]
source = ["cherrytree_mcp"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
